@if (isOpen() && produto()) {
  <div class="modal-backdrop fade-in" (click)="onClose()">
    <div class="modal-card small-modal" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title">
          {{ tipo() === 'baixar' ? 'Baixar Saldo de Estoque' : 'Estornar / Adicionar Saldo' }}
        </h3>
        <button class="btn-close-modal" (click)="onClose()">✕</button>
      </div>

      <div class="modal-body">
        <div class="selected-product-summary">
          <img [src]="getImagemProduto(produto()?.imagemUrl)" class="summary-thumb" [alt]="produto()?.descricao" />
          <div>
            <strong>{{ produto()?.descricao }}</strong>
            <div class="text-muted">Código: {{ produto()?.codigo }} | Saldo Atual: {{ produto()?.saldo }} un</div>
          </div>
        </div>

        <div class="form-group mt-3">
          <label class="form-label">Quantidade a {{ tipo() === 'baixar' ? 'baixar' : 'estornar' }}</label>
          <input
            type="number"
            min="1"
            class="form-input"
            [(ngModel)]="quantidade"
          />
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" (click)="onClose()">Cancelar</button>
        <button
          class="btn-primary"
          [class.btn-danger]="tipo() === 'baixar'"
          (click)="onSave()"
        >
          Confirmar {{ tipo() === 'baixar' ? 'Baixa' : 'Estorno' }}
        </button>
      </div>
    </div>
  </div>
}
